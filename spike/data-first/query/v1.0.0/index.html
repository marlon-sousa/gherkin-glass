<!doctype html>
<html lang="en" data-version="v1.0.0" data-routing="query">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gherkin-glass examples, v1.0.0</title>
<script>try{var t=localStorage.getItem("gherkin-glass:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root,
:root[data-theme="light"] {
  color-scheme: light;
  --ghg-background: #ffffff;
  --ghg-surface: #f2f2f2;
  --ghg-text: #1a1a1a;
  --ghg-muted: #474747;
  --ghg-border: #757575;
  --ghg-accent: #0b4f9c;
  --ghg-keyword: #6a1b9a;
  --ghg-parameter: #14521a;
  --ghg-number: #8a3000;
  --ghg-placeholder: #00575e;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ghg-background: #141414;
    --ghg-surface: #222222;
    --ghg-text: #ececec;
    --ghg-muted: #c4c4c4;
    --ghg-border: #8f8f8f;
    --ghg-accent: #8cc4ff;
    --ghg-keyword: #e1b3ff;
    --ghg-parameter: #9fe0a8;
    --ghg-number: #ffbf8a;
    --ghg-placeholder: #7fdbe0;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ghg-background: #141414;
  --ghg-surface: #222222;
  --ghg-text: #ececec;
  --ghg-muted: #c4c4c4;
  --ghg-border: #8f8f8f;
  --ghg-accent: #8cc4ff;
  --ghg-keyword: #e1b3ff;
  --ghg-parameter: #9fe0a8;
  --ghg-number: #ffbf8a;
  --ghg-placeholder: #7fdbe0;
}
</style>
<link rel="stylesheet" href="../../assets/gherkin-glass.css">
<style>
.ghg-spike-announcer{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.ghg-spike-versions,.ghg-spike-page-versions{border-left:3px solid var(--ghg-border);padding-left:.75em;margin:.5em 0}
.ghg-spike-versions p,.ghg-spike-page-versions p{margin:.25em 0}
.ghg-spike-versions ul,.ghg-spike-page-versions ul{margin:.25em 0}
[id]{scroll-margin-top:.75em}
.ghg-spike-banner{background:var(--ghg-surface);padding:.5em 1em;margin:0}
</style>
<link rel="icon" href="../../assets/gherkin-glass.svg" type="image/svg+xml">
<script type="module" src="../../app.js"></script>
</head>
<body>
<a class="ghg-skip" href="#ghg_main">Skip to content</a>
<div class="ghg-options">
<fieldset class="ghg-theme">
<legend>Theme</legend>
<label><input type="radio" name="ghg-theme" value="system" checked> System</label>
<label><input type="radio" name="ghg-theme" value="light"> Light</label>
<label><input type="radio" name="ghg-theme" value="dark"> Dark</label>
</fieldset>
</div>
<div class="ghg-layout">
<div class="ghg-page">
<p class="ghg-spike-banner" role="note">Spike for issue 173: this page is drawn from shared data, with addresses of the form index.html?page=page#anchor. <a href="../../index.html">About the spike</a>.</p>
<nav id="ghg_breadcrumb" class="ghg-breadcrumb" aria-label="Breadcrumb"></nav>
<main id="ghg_main" tabindex="-1" aria-busy="true"></main>
</div>
</div>
<div id="ghg_announcer" class="ghg-spike-announcer" role="alert" aria-live="assertive"></div>
<footer class="ghg-footer">
<p>Spike of gherkin-glass 2.0, not a release.</p>
</footer>
</body>
</html>
