[package]
name = "gherkin-glass"
version = "2.0.0-alpha.1"
edition = "2024"
# The oldest Rust that builds gherkin-glass, checked by its own CI job. The
# toolchain contributors and CI build with is pinned in rust-toolchain.toml.
rust-version = "1.88"
description = "An accessible static viewer for Gherkin feature files"
repository = "https://github.com/marlon-sousa/gherkin-glass"
license = "MIT OR Apache-2.0"
readme = "README.crate.md"
# What `cargo run` runs, of the two binaries below.
default-run = "ghg"
keywords = ["gherkin", "cucumber", "bdd", "accessibility", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools::cargo-plugins", "development-tools::testing"]
# What crates.io receives: what builds the binaries, with the licences and the
# README it shows, written from README.md without the parts only GitHub shows.
# The tests and their fixtures, the script's sources and xtask stay in the
# repository.
include = ["/src/", "/askama.toml", "/assets/", "/messages/", "/i18n.toml", "/README.crate.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[workspace]
# The crate behind cargo xtask, never shipped.
members = ["xtask"]

# No unsafe code, no pub that nothing outside its module can reach, and no
# panic outside tests; clippy.toml allows panics in tests.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[lints]
workspace = true

# Two binaries running the same code, as docs/BEHAVIOUR.md, "Installing
# through cargo", says: the command, and the cargo plugin run as `cargo ghg`.
[[bin]]
name = "ghg"
path = "src/main.rs"

[[bin]]
name = "cargo-ghg"
path = "src/cargo_ghg.rs"

[dependencies]
askama = "0.16.1"
bon = "3.10.3"
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "error-context"] }
crossbeam-channel = "0.5.17"
ctrlc = { version = "3.5.2", features = ["termination"] }
gherkin = "0.16.0"
http = "1.5.0"
httparse = "1.10.1"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
ignore = "0.4.34"
mime_guess = { version = "2.0.5", default-features = false }
mio = { version = "1.2.4", features = ["os-poll", "net"] }
notify-debouncer-full = "0.7.0"
rayon = "1.12.0"
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
sha2 = { version = "0.11.1", default-features = false }
snapfit = "0.2.0"
thiserror = "2"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse"] }
unicode-normalization = "0.1.26"
derive_more = { version = "2.1.1", default-features = false, features = ["constructor", "display"] }
ego-tree = "0.11.1"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
pulldown-cmark-to-cmark = "23.0.1"

# Where `cargo binstall gherkin-glass` finds each release archive, as
# docs/BEHAVIOUR.md, "Releases", names them.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/ghg-v{ version }-{ target }.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/ghg-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/ghg-v{ version }-{ target }.zip"
pkg-fmt = "zip"

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rstest = { version = "0.28.0", default-features = false }
scraper = { version = "0.29.0", default-features = false }
