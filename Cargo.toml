[package]
name = "gherkin-glass"
version = "0.1.0"
edition = "2024"
# The oldest Rust that builds gherkin-glass, checked by its own CI job. The
# toolchain contributors and CI build with is pinned in rust-toolchain.toml.
rust-version = "1.88"
description = "An accessible static viewer for Gherkin feature files"
repository = "https://github.com/marlon-sousa/gherkin-glass"
license = "MIT OR Apache-2.0"
readme = "README.md"
# What `cargo run` runs, of the two binaries below.
default-run = "ghg"
keywords = ["gherkin", "cucumber", "bdd", "accessibility", "cargo-subcommand"]
categories = ["command-line-utilities", "development-tools::cargo-plugins", "development-tools::testing"]
# What crates.io receives: what builds the binaries, with the licences and the
# README it shows. The tests and their fixtures, the script's sources and
# xtask stay in the repository.
include = ["/src/", "/templates/", "/assets/", "/messages/", "/i18n.toml", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[workspace]
# The crate behind cargo xtask, never shipped.
members = ["xtask"]

# Two binaries running the same code, as docs/BEHAVIOUR.md, "Installing
# through cargo", says: the command, and the cargo plugin run as `cargo ghg`.
[[bin]]
name = "ghg"
path = "src/main.rs"

[[bin]]
name = "cargo-ghg"
path = "src/cargo_ghg.rs"

[dependencies]
askama = "0.16.1"
gherkin = "0.16.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.1"
ignore = "0.4.34"
lexopt = "0.3.2"
mime_guess = { version = "2.0.5", default-features = false }
notify-debouncer-full = "0.7.0"
rayon = "1.12.0"
regex-automata = "0.4.18"
regex-syntax = "0.8.11"
rust-embed = "8.13.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
thiserror = "2"
tiny_http = "0.12.0"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse"] }
unicode-normalization = "0.1.26"
