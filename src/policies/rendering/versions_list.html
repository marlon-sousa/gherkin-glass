{%- if collapsed -%}
<div class="ghg-block">
<h{{ level.number() }} id="{{ id }}"><button type="button" class="ghg-toggle" aria-expanded="false">{{ heading }}</button></h{{ level.number() }}>
<div class="ghg-content" hidden>
<ul class="ghg-versions">
{%- for entry in entries %}
{{ entry|safe }}
{%- endfor %}
</ul>
</div>
</div>
{%- else -%}
<h{{ level.number() }} id="{{ id }}">{{ heading }}</h{{ level.number() }}>
<ul class="ghg-versions">
{%- for entry in entries %}
{{ entry|safe }}
{%- endfor %}
</ul>
{%- endif -%}
