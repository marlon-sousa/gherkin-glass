<h1 class="ghg-search-heading">{{ page.heading }}</h1>
<form class="ghg-search-page" role="search" action="{{ address }}" method="get" data-heading="{{ page.words.heading }}" data-title="{{ page.words.title }}" data-loading="{{ page.words.loading }}" data-failed="{{ page.words.failed }}" data-none="{{ page.words.none }}" data-count="{{ page.words.count }}" data-within="{{ page.words.within }}" data-separator="{{ page.words.separator }}" data-matching-steps="{{ page.words.matching_steps }}" data-matching-tags="{{ page.words.matching_tags }}" data-matching-cells="{{ page.words.matching_cells }}" data-feature="{{ page.words.headings.feature }}" data-unnamed-feature="{{ page.words.headings.unnamed_feature }}" data-rule="{{ page.words.headings.rule }}" data-unnamed-rule="{{ page.words.headings.unnamed_rule }}" data-background="{{ page.words.headings.background }}" data-unnamed-background="{{ page.words.headings.unnamed_background }}" data-scenario="{{ page.words.headings.scenario }}" data-unnamed-scenario="{{ page.words.headings.unnamed_scenario }}" data-scenario-outline="{{ page.words.headings.scenario_outline }}" data-unnamed-scenario-outline="{{ page.words.headings.unnamed_scenario_outline }}" data-examples="{{ page.words.headings.examples }}" data-numbered-examples="{{ page.words.headings.numbered_examples }}">

</form>

<div class="ghg-search-groups"></div>
