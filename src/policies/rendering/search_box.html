<form class="ghg-search" role="search" data-shown="{{ search.words.shown }}" data-loading="{{ search.words.loading }}" data-failed="{{ search.words.failed }}" data-none="{{ search.words.none }}" data-count="{{ search.words.count }}" data-count-limited="{{ search.words.count_limited }}" data-no-name="{{ search.words.no_name }}" data-feature="{{ search.words.feature }}" data-rule="{{ search.words.rule }}" data-scenario="{{ search.words.scenario }}" data-scenario-in-rule="{{ search.words.scenario_in_rule }}" data-scenario-outline="{{ search.words.scenario_outline }}" data-scenario-outline-in-rule="{{ search.words.scenario_outline_in_rule }}" data-background="{{ search.words.background }}" data-background-in-rule="{{ search.words.background_in_rule }}" data-examples="{{ search.words.examples }}" data-examples-in-rule="{{ search.words.examples_in_rule }}" data-numbered-examples="{{ search.words.numbered_examples }}" data-all-results="{{ search.words.all_results }}">
<label>{{ search.words.label }} <input type="search" class="ghg-search-field" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="ghg_search_results" autocomplete="off" spellcheck="false" enterkeyhint="search"></label>

</form>
