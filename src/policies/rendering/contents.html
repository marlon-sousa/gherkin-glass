<ul>
{%- for entry in contents.entries %}
<li><a href="{{ contents.page }}#{{ entry.anchor }}">{{ entry.heading }}</a>
{%- if !entry.entries.is_empty() %}
<ul>
{%- for inner in entry.entries %}
<li><a href="{{ contents.page }}#{{ inner.anchor }}">{{ inner.heading }}</a></li>
{%- endfor %}
</ul>
{%- endif %}</li>
{%- endfor %}
</ul>
