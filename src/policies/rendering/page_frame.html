{{ disk_notice|safe }}
{{ skip_link|safe }}
<div class="ghg-options">
<span class="ghg-option ghg-tree-choice"><input type="checkbox" id="ghg_show_tree" class="ghg-show-tree" aria-controls="ghg_tree"{% if frame.tree_shown %} checked{% endif %}> <label for="ghg_show_tree">{{ frame.show_tree }}</label></span>
<button type="button" class="ghg-tree-button" aria-expanded="false" aria-controls="ghg_tree">{{ frame.tree }}</button>
{{ theme_control|safe }}
</div>
