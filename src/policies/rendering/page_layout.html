<!doctype html>
<html lang="{{ language }}">
{{ head|safe }}
<body>
{{ frame|safe }}
<div class="ghg-layout">
{{ tree|safe }}
<div class="ghg-page">
{{ breadcrumb|safe }}
{%- if !search.is_empty() %}
{{ search|safe }}
{%- endif %}
<main id="ghg_main">
{%- if let Some(only_note) = only_note %}
<p class="ghg-only-note" role="note">{{ only_note }}</p>
{%- endif %}
{{ main|safe }}
</main>
{{ footer|safe }}
</div>
</div>
</body>
</html>
