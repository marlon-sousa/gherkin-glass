<h2><a href="{{ feature.address }}"{% if let Some(lang) = feature.language %} lang="{{ lang }}"{% endif %}>{{ feature.heading_before.render()|safe }}<span class="ghg-tag-path">{{ feature.path }}</span>{{ feature.heading_after }}</a></h2>
{%- if scenarios.is_empty() %}
<p>{{ no_scenario }}</p>
{%- else %}
<ul class="ghg-tag-scenarios">
{%- for scenario in scenarios %}
{{ scenario|safe }}
{%- endfor %}
</ul>
{%- endif %}
