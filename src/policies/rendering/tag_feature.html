<h2><a href="{{ feature.address }}">{{ feature.heading_before.render_in(feature.language.as_deref())|safe }}<span class="ghg-tag-path">{{ feature.path }}</span>{{ feature.heading_after }}</a></h2>
{%- if scenarios.is_empty() %}
<p>{{ no_scenario }}</p>
{%- else %}
<ul class="ghg-tag-scenarios">
{%- for scenario in scenarios %}
{{ scenario|safe }}
{%- endfor %}
</ul>
{%- endif %}
