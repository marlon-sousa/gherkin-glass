name: Release

# docs/BEHAVIOUR.md, "Releases". Pushing a tag v<version> releases that
# version. The gate and the checks of rust.yml run beside the release tools'
# own tests, the five builds and the archives; crates.io waits for all of
# them, and the GitHub release for crates.io. On a pull request that changes
# how releases are made, the tests, builds and archives run, and nothing is
# published. rust.yml packs the crate on every pull request.

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - .github/workflows/release.yml
      - .github/release/**
      - tests/fixtures/release/**
      - cliff.toml
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - build.rs
      - .cargo/**
      - src/main.rs
      - src/cargo_ghg.rs

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A release, once started, is never cut short by another run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The tag being released, or on a pull request the tag the version in
  # Cargo.toml would have, so that the archives are named as a release names them.
  TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}

jobs:
  gate:
    name: release gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: .github/release/gate.sh "$TAG" "$GITHUB_SHA"

  ci:
    name: checks
    needs: gate
    uses: ./.github/workflows/rust.yml

  release-tools:
    name: release notes and gate, against their fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: pip install git-cliff==2.14.2
      - run: .github/release/test-notes.sh
      - run: .github/release/test-gate.sh
      - run: .github/release/test-check-archive.sh
      - run: .github/release/test-action-tag.sh

  build:
    name: build for ${{ matrix.target }}
    needs: release-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Built on Apple silicon, the runners GitHub keeps providing.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - if: runner.os == 'Windows'
        run: rustup component add llvm-tools
      - name: Link the C runtime into the Windows binaries
        if: runner.os == 'Windows'
        run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
      - name: Name the tag on a pull request
        if: github.event_name == 'pull_request'
        run: echo "TAG=v$(.github/release/version.sh)" >> "$GITHUB_ENV"
      - run: cargo build --release --locked --bins --target ${{ matrix.target }}
      - name: Check each binary needs nothing installed
        run: |
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          for bin in $(.github/release/binaries.sh); do
            .github/release/check-binary.sh "target/${{ matrix.target }}/release/$bin$ext" ${{ matrix.target }}
          done
      - run: .github/release/pack.sh "$TAG" ${{ matrix.target }} dist
      - run: .github/release/check-archive.sh dist/ghg-"$TAG"-${{ matrix.target }}.* "$TAG" ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  archives:
    name: archives, checksums and cargo binstall
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          path: dist/
          merge-multiple: true
      - name: Name the tag on a pull request
        if: github.event_name == 'pull_request'
        run: echo "TAG=v$(.github/release/version.sh)" >> "$GITHUB_ENV"
      - run: .github/release/check-binstall.sh "$TAG" dist
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum -- ghg-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "$(printf '%s\n' ghg-* | wc -l)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    name: crates.io
    if: github.event_name == 'push'
    needs: [ci, archives]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: itinera-dev/actions/publish-crates@d49d88f6b15f4d4c344503e9e3304a449ee3ebe8 # v1.11.0

  release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist/
      - uses: itinera-dev/actions/create-release@d49d88f6b15f4d4c344503e9e3304a449ee3ebe8 # v1.11.0
        with:
          assets: dist/

  action-tag:
    # docs/BEHAVIOUR.md, "The GitHub Action", rule 177: uses:
    # marlon-sousa/gherkin-glass@v1 runs the action of the newest 1.x release.
    name: the action's major version tag
    if: github.event_name == 'push'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Move the major version's tag to the release
        run: |
          major=$(git tag --list | .github/release/action-tag.sh "$TAG")
          if [ -z "$major" ]; then
            echo "$TAG moves no tag of the action."
            exit 0
          fi
          git tag --force "$major" "$TAG^{commit}"
          if ! git push --force origin "refs/tags/$major"; then
            echo "::error::$major cannot be moved. Move it by hand with: git push --force origin $TAG^{commit}:refs/tags/$major"
            exit 1
          fi
          echo "$major now names $TAG."

  site:
    # docs/BEHAVIOUR.md, "The project's own site": the release's own version
    # of the site, added to the gh-pages branch.
    name: the project's own site
    if: github.event_name == 'push'
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/site.yml
    with:
      version: ${{ github.ref_name }}
