name: Site

# The project's own site, docs/BEHAVIOUR.md, "The project's own site". The
# release workflow calls this once a release is published, with the release's
# tag as version, from a job that grants contents: write, since a called
# workflow cannot have more permissions than its caller. It builds the site of
# that version with the binary the release has just published, downloaded
# from it and checked against its SHA256SUMS, since gherkin-glass-action 1
# drives only ghg 1, with the tag's README as the site's front page, straight
# into a checkout of the gh-pages branch, keeping its .nojekyll and .git, and
# adds it to the branch. When the branch holds a site of gherkin-glass 1, it
# first adds again, with the same binary, every version that site held, each
# from its own tag, and pushes them with the release's own version.

on:
  workflow_call:
    inputs:
      version:
        description: The tag of the published release, such as v0.1.0.
        required: true
        type: string

permissions:
  contents: write

# One release at a time adds its folder, so that two never race to push. GitHub
# keeps one waiting run per group and cancels an older one waiting, so a
# release whose run is cancelled this way is published by running it again.
# The calling job must not use this group itself, or the two wait on each other.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  site:
    name: add the release to the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version }}
          # Every tag, so that the versions of a site of gherkin-glass 1 are
          # built again from their own.
          fetch-depth: 0
      - name: Open the gh-pages branch
        run: project-site/publish.sh open "$RUNNER_TEMP/pages" > "$RUNNER_TEMP/earlier-versions"
      - name: Gather the example suite and the fixtures
        run: project-site/assemble-input.sh "$RUNNER_TEMP/input"
      - name: Write the front page from the README
        run: project-site/front-page.sh README.md "$RUNNER_TEMP/front-page.md"
      - name: Download the released ghg
        run: |
          archive="ghg-$VERSION-x86_64-unknown-linux-musl.tar.gz"
          mkdir "$RUNNER_TEMP/ghg"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern SHA256SUMS --dir "$RUNNER_TEMP/ghg"
          cd "$RUNNER_TEMP/ghg"
          grep -F "  $archive" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$archive"
          echo "$RUNNER_TEMP/ghg" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
      - name: Build again with the released ghg the versions of gherkin-glass 1
        run: |
          while IFS= read -r earlier; do
            if ! git rev-parse --quiet --verify "refs/tags/$earlier^{commit}" >/dev/null; then
              echo "$earlier: the site held this version, but the repository has no such tag to build it again from." >&2
              exit 1
            fi
            git worktree add --quiet --detach "$RUNNER_TEMP/tags/$earlier" "refs/tags/$earlier"
            "$RUNNER_TEMP/tags/$earlier/project-site/assemble-input.sh" "$RUNNER_TEMP/inputs/$earlier"
            ghg version add "$earlier" \
              --title "gherkin-glass examples" \
              --input "$RUNNER_TEMP/inputs/$earlier" \
              --output "$RUNNER_TEMP/pages" \
              --front-page "$RUNNER_TEMP/front-page.md" \
              --keep-in-output .nojekyll \
              --keep-in-output .git
            project-site/publish.sh commit "$RUNNER_TEMP/pages" "$earlier"
          done < "$RUNNER_TEMP/earlier-versions"
      - name: Build the site with the released ghg
        run: >-
          ghg version add "$VERSION"
          --title "gherkin-glass examples"
          --input "$RUNNER_TEMP/input"
          --output "$RUNNER_TEMP/pages"
          --front-page "$RUNNER_TEMP/front-page.md"
          --keep-in-output .nojekyll
          --keep-in-output .git
        env:
          VERSION: ${{ inputs.version }}
      - name: Publish the version's folder and the versions page
        run: project-site/publish.sh publish "$RUNNER_TEMP/pages" "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
