<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<style>
{{ theme|safe }}</style>
<link rel="stylesheet" href="{{ root }}assets/gherkin-glass.css">
<script type="module" src="{{ root }}assets/gherkin-glass.js"></script>
</head>
<body>
<a class="ghg-skip" href="#ghg_main">{{ frame.skip_link }}</a>
<div class="ghg-options">
<input type="checkbox" id="ghg_show_tree" class="ghg-show-tree" aria-controls="ghg_tree"{% if frame.tree_shown %} checked{% endif %}> <label for="ghg_show_tree">{{ frame.show_tree }}</label>
</div>
<div class="ghg-layout">
<nav id="ghg_tree" class="ghg-tree" aria-label="{{ frame.tree }}"{% if !frame.tree_shown %} hidden{% endif %}></nav>
<div class="ghg-page">
<nav class="ghg-breadcrumb" aria-label="{{ breadcrumb.label }}">
<ol>
{%- for crumb in breadcrumb.crumbs %}
<li><a href="{{ crumb.address }}"{% if loop.last %} aria-current="page"{% endif %}>{{ crumb.text }}</a></li>
{%- endfor %}
</ol>
</nav>
<main id="ghg_main">
{% block main %}{% endblock %}
</main>
</div>
</div>
</body>
</html>
