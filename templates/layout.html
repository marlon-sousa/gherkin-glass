<!doctype html>
<html lang="{{ language }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }}</title>
<script>try{var t=localStorage.getItem("gherkin-glass:theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
{{ frame.theme_style|safe }}</style>
<link rel="stylesheet" href="{{ root }}assets/gherkin-glass.css">
<script type="module" src="{{ root }}assets/gherkin-glass.js"></script>
</head>
<body>
<a class="ghg-skip" href="#ghg_main">{{ frame.skip_link }}</a>
<div class="ghg-options">
<input type="checkbox" id="ghg_show_tree" class="ghg-show-tree" aria-controls="ghg_tree"{% if frame.tree_shown %} checked{% endif %}> <label for="ghg_show_tree">{{ frame.show_tree }}</label>
<fieldset class="ghg-theme">
<legend>{{ frame.theme }}</legend>
<label><input type="radio" name="ghg-theme" value="system" checked> {{ frame.theme_system }}</label>
<label><input type="radio" name="ghg-theme" value="light"> {{ frame.theme_light }}</label>
<label><input type="radio" name="ghg-theme" value="dark"> {{ frame.theme_dark }}</label>
</fieldset>
</div>
<div class="ghg-layout">
<nav id="ghg_tree" class="ghg-tree" aria-label="{{ frame.tree }}"{% if !frame.tree_shown %} hidden{% endif %}></nav>
<div class="ghg-page">
<nav class="ghg-breadcrumb" aria-label="{{ breadcrumb.label }}">
<ol>
{%- for crumb in breadcrumb.crumbs %}
<li><a href="{{ crumb.address }}"{% if loop.last %} aria-current="page"{% endif %}>{{ crumb.text }}</a></li>
{%- endfor %}
</ol>
</nav>
<form class="ghg-search" role="search" data-root="{{ root }}" data-shown="{{ frame.search.shown }}" data-loading="{{ frame.search.loading }}" data-failed="{{ frame.search.failed }}" data-none="{{ frame.search.none }}" data-count="{{ frame.search.count }}" data-count-limited="{{ frame.search.count_limited }}" data-no-name="{{ frame.search.no_name }}" data-feature="{{ frame.search.feature }}" data-rule="{{ frame.search.rule }}" data-scenario="{{ frame.search.scenario }}" data-scenario-in-rule="{{ frame.search.scenario_in_rule }}" data-scenario-outline="{{ frame.search.scenario_outline }}" data-scenario-outline-in-rule="{{ frame.search.scenario_outline_in_rule }}">
<label>{{ frame.search.label }} <input type="search" class="ghg-search-field" autocomplete="off" spellcheck="false" enterkeyhint="search"></label>
<p class="ghg-search-status" role="status"></p>
<ol class="ghg-search-results" hidden></ol>
</form>
<main id="ghg_main">
{% block main %}{% endblock %}
</main>
</div>
</div>
</body>
</html>
